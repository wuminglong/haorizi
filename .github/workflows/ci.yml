name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AUTO_CREATE_TABLES: "false"
      DATABASE_URL: sqlite:///${{ runner.temp }}/haorizi-ci.db
      SESSION_SECRET: ci-only-session-secret
      ADMIN_TOKEN: ci-only-admin-token
      PUSHPLUS_ENABLED: "false"

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --requirement backend/requirements-dev.txt

      - name: Verify migrations from an empty database
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Run tests
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q backend/app backend/alembic
