name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haorizi-production
  # Do not terminate an SSH session in the middle of a production cutover.
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AUTO_CREATE_TABLES: "false"
      DATABASE_URL: sqlite:///${{ runner.temp }}/haorizi-deploy-check.db
      SESSION_SECRET: ci-only-session-secret
      ADMIN_TOKEN: ci-only-admin-token
      PUSHPLUS_ENABLED: "false"

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --requirement backend/requirements-dev.txt

      - name: Verify migrations from an empty database
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Run tests
        run: python -m pytest -q

  deploy:
    name: deploy
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://openday.cloud/haorizi/

    steps:
      - name: Configure restricted SSH client
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/haorizi-deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          test -s ~/.ssh/haorizi-deploy
          test -s ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/haorizi-deploy ~/.ssh/known_hosts

      - name: Deploy exact commit
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          port="${DEPLOY_PORT:-22}"
          ssh -i ~/.ssh/haorizi-deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$port" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "deploy $TARGET_SHA"
